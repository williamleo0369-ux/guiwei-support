name: 问题反馈 / Bug report
description: 提交匿名复现步骤 / Share anonymous reproduction steps
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: '此处公开可见，请勿上传私人照片、备份、地址、密码或验证码。 This form is public. Do not share private photos, backups, addresses or credentials.'
  - type: input
    id: version
    attributes:
      label: 应用与系统版本 / App and iOS versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与预期结果 / Steps and expected result
    validations:
      required: true
